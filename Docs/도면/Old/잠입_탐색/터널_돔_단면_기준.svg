<text x='65' y='895' font-size='23' fill='#273b4e'>함께 맞추는 항목</text>
<text x='65' y='938' font-size='21' fill='#273b4e'>평면도: 방·문·설비·예상 이동  /  단면: 터널·돔·문 접합  /  Unity: 같은 치수의 메시·충돌·조명</text>
<text x='65' y='980' font-size='19' fill='#273b4e'>계단·리프트 연결 위치와 방 크기는 유지하며, 기존 사각 천장과 큰 차폐벽을 새 곡면 구조에 남겨 겹치지 않는다.</text>
<text x='65' y='1022' font-size='19' fill='#273b4e'>엄폐는 벽 쪽 설비에서 제공한다. 긴 시야·경비 배치와 감시 난이도는 이후 사용자 플레이로 조정한다.</text>
<text x='65' y='1090' font-size='17' fill='#5e7180'>B5/B4/B3 제작 기준 · B2/B1/1F는 수직 코어를 공유하는 설계 가안 · 게임 C# / UI / 미니맵은 미구현</text>
