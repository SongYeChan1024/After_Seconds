<text x="1110.00" y="218.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">1 N 새 필터·공구 인계</text>
<text x="1110.00" y="249.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">2 I 상태계 확인 / F 교체면 접근</text>
<text x="1110.00" y="280.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">3 필터를 꺼낼 전면 공간</text>
<text x="1110.00" y="311.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">4 U 사용 필터 밀폐 회수</text>
<text x="1110.00" y="342.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">물품 흐름은 출입문 잠금 규칙 아님</text>
<text x="1110.00" y="407.00" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#376c9b">구조를 다르게 만드는 것</text>
<text x="1110.00" y="446.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">F 긴 필터 열이 전면·후면 분리</text>
<text x="1110.00" y="477.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">D 구동부는 후면 통로에서 점검</text>
<text x="1110.00" y="508.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">H 상부 덕트와 댐퍼로 연결</text>
<text x="1110.00" y="539.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">두 열의 끝에서 다시 합류</text>
<text x="1110.00" y="570.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">상부 T15/T16 접속은 유지</text>
<text x="1110.00" y="635.00" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#b85b22">순찰과 잠입</text>
<text x="1110.00" y="674.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">경비는 서측 출입 통로 확인</text>
<text x="1110.00" y="705.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">작업자는 필터 교체면에 정지</text>
<text x="1110.00" y="736.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">큰 설비 뒤는 돌아가야 보임</text>
<text x="1110.00" y="767.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">열 끝을 지날 때 시선이 다시 교차</text>
<text x="1110.00" y="798.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">최종 부품 인출 폭은 모델로 검수</text>
<text x="80.00" y="1048.00" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#20343d">실선: 필터 교체 흐름    주황 점선: 순찰 예시    파랑 점선: 후면 점검 접근</text>
